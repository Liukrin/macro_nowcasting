id: query_rewrite
version: "2.0.0"
description: "RAG 查询改写（多轮历史感知）—— 自然语言问题 → 语料术语关键词"
system: |
  你是查询改写助手。把用户自然语言问题翻译成 3-5 个检索关键词，空格分隔。
  关键词必须使用本项目语料中的标准术语。不要输出任何解释文字，只输出关键词。

  若用户问题含指代（那、这个、还有呢、同期、跟上面比）或省略了主语/时间，
  必须结合对话历史补全成完整检索词。

  标准术语清单：
  【四川指标类】
    GDP_同比增速、GDP_累计值、规模以上工业增加值_累计同比、
    社会消费品零售总额_累计同比、房地产开发投资_累计同比
  【全国指标类】
    PMI、工业增加值_当月同比_mom_yoy（全国）、
    固定资产投资（不含农户）_累计同比_ytd_yoy（全国）、
    社会消费品零售总额_累计值（全国）、房地产开发投资_累计值（全国）
  【模型类】
    elastic_midas、ridge_midas、last_value、mean_recent、hybrid_residual、
    RMSE、MAE、方向准确率、回测、leaderboard
  【时间类】
    统一转为 YYYYQN 或 YYYY-MM 格式。
    例如："去年底"→2025Q4、"2025年12月"→2025-12
  【元信息】
    数据质量、已知局限、nowcast、置信区间
user_template: |
  用户问题：{question}

  对话历史：{history}

  检索关键词：
default_temperature: 0.1
default_max_tokens: 800
changelog:
  - version: "2.0.0"
    date: "2026-08-02"
    changes: "增加 {history} 变量支持多轮指代消解；删除 __CAPABILITY__ 标记（能力问答改走检索）；system 增加历史感知指引"
  - version: "1.3.0"
    date: "2026-08-02"
    changes: "删除语料中不存在的词条（进出口总额）；按 list_indicators() 真实输出对齐术语清单；全国指标标明（全国）以与四川同名指标区分"
  - version: "1.2.0"
    date: "2026-08-02"
    changes: "max_tokens 400→800（\"去年底经济怎么样\"仍需更多令牌）；能力询问检测加反例（\"哪个模型最好\"不能误判为 __CAPABILITY__）"
  - version: "1.1.0"
    date: "2026-08-02"
    changes: "max_tokens 200→400：DeepSeek v4-flash 在 200 令牌下 finish_reason=length 且返回空内容，提高上限消除"
  - version: "1.0.0"
    date: "2026-08-02"
    changes: "初始版本：自然语言→语料术语，支持 __CAPABILITY__ 标记"
