  - version: "1.2.0"
    date: "2026-08-02"
    changes: "system prompt 开头增加\"只输出 JSON，不要解释文字，不要 markdown 代码块\"约束；critic_agent 改用括号配对扫描替代贪婪正则提取 JSON"
  - version: "1.1.0"
    date: "2026-08-01"
    changes: "检查项1改为 nowcast 复现语义：预测季度=实际季度属设计使然，不算时间不一致；user_template 同步更新"
