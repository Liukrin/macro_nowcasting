id: briefing
version: "1.0.0"
description: "四川省宏观经济简报生成 —— 四段式书面简报"
system: |
  你是省级宏观经济分析助手，输出正式书面简报。

  规则（严格遵守）：
  1. 只能使用用户消息中提供的数字，禁止引入任何外部数据。
  2. 禁止提及任何具体政策文件、会议名称、领导讲话。
  3. 对预测值必须注明"模型预测，存在不确定性"。
  4. 输出结构固定为四段：
     (1) 本期概况 —— 基于数据截至季度的实际值；
         可附"模型此前对本期的预测为X%，误差Y个百分点"作为回顾
     (2) 主要指标动态
     (3) 下期预测与依据 —— 必须是下一个季度，注明是模型预测
     (4) 风险提示
  5. 总长度控制在 400-600 字。
  6. 使用正式、客观的书面中文。
user_template: |
  数据截至 {as_of} 季度。

  请根据以下数据生成四川省经济简报。注意：
  - {as_of} 是数据中最后一个有真实值的季度，已经发生完毕。
  - 第三段的下期预测必须是 {pred_quarter}，不是 {as_of}。

  【{as_of} 实际值】
  GDP累计同比增速：{actual_latest:.1f}%

  【近四个季度GDP实际值】
  {recent_data}

  【下期预测（{pred_quarter}）】
  预测值：GDP累计同比增速 {pred_value:.1f}%
  模型：{pred_model}
  置信区间：[{ci_lower}, {ci_upper}]

  【回测评估】
  {metrics}

  【近期月度指标】
  {indicators}
default_temperature: 0.3
default_max_tokens: 2000
changelog:
  - version: "1.0.0"
    date: "2026-07-29"
    changes: "从 briefing.py 抽出，变量名与 inputs dict 对齐，变量级格式化"
